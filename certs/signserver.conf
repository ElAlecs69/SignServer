server {
    listen 80;
    server_name _;
    # Redirige todo el tráfico HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/signserver-web.crt;
    ssl_certificate_key /etc/nginx/certs/signserver-web.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Debe ser igual o mayor al max-post-size configurado en WildFly (200 MB),
    # considerando el ~33% extra que agrega la codificación Base64.
    client_max_body_size 260M;

    # Página web estática (frontend)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Proxy transparente hacia el API REST de SignServer
    location /signserver/ {
        proxy_pass http://signserver-app:8080/signserver/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Archivos grandes pueden tardar; se amplían los timeouts por defecto (60s)
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Evita que nginx almacene en buffer el cuerpo completo antes de enviarlo,
        # reduciendo uso de memoria con archivos grandes.
        proxy_request_buffering off;
    }
}
