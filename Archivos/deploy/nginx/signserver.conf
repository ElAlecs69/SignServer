server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Puerto plano, sin redirección, para exponer detrás de un túnel que ya
# maneja HTTPS por su cuenta (por ejemplo ngrok). No usar para acceso directo.
server {
    listen 8081;
    server_name _;

    client_max_body_size 260M;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /signserver/ {
        proxy_pass http://signserver-app:8080/signserver/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/signserver-web.crt;
    ssl_certificate_key /etc/nginx/certs/signserver-web.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Debe ser igual o mayor al max-post-size configurado en WildFly (200 MB),
    # considerando el ~33% extra que agrega la codificación Base64.
    client_max_body_size 260M;

    # Frontend estático (contenido de /dist tras `npm run build`)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy transparente hacia el API REST de SignServer
    location /signserver/ {
        proxy_pass http://signserver-app:8080/signserver/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
