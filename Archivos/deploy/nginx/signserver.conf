server {
    listen 80;
    server_name 148.215.109.222;
    return 301 https://148.215.109.222$request_uri;
}

server {
    listen 443 ssl;
    server_name 148.215.109.222;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Debe ser igual o mayor al max-post-size configurado en WildFly (200 MB),
    # considerando el ~33% extra que agrega la codificación Base64.
    client_max_body_size 260M;

    # Frontend estático (contenido de /dist tras `npm run build`)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy transparente hacia el API REST de SignServer
    location /signserver/ {
        return 403;
    }

    location /api/ {
           proxy_pass http://document-api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location /auth/ {
        proxy_pass http://document-api:8001/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy hacia el servicio de validacion
    location /validate/ {
        proxy_pass http://signserver-validate:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
}
